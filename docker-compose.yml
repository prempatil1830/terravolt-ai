version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: solar_pv_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: solar_pv_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=solar_pv_karnataka
      - REPLAY=1
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./geoprocessing/data:/app/geoprocessing/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solar_pv_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
